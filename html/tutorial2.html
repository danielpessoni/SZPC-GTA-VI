<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA VI — o código e o comportamento, lado a lado</title>
<style>
  :root{
    --noite:#0b0713;
    --painel:#150e24;
    --painel-2:#1c1330;
    --linha:#2e2145;
    --tinta:#f4effb;
    --apagado:#9c8dbb;
    --rosa:#ff3d8b;
    --ciano:#35d6e7;
    --creme:#f7e8c9;
    --roxo:#a259ff;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}

  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(162,89,255,.18), transparent 60%),
      radial-gradient(900px 500px at 0% 40%, rgba(255,61,139,.10), transparent 60%),
      var(--noite);
    color:var(--tinta);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .display{
    font-family:"Anton","Impact","Haettenschweiler","Franklin Gothic Bold","Arial Narrow",sans-serif;
    font-weight:400;letter-spacing:.02em;text-transform:uppercase;
  }

  /* ---------- barra fixa ---------- */
  .barra{
    position:sticky;top:0;z-index:50;
    background:rgba(11,7,19,.86);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--linha);
  }
  .barra-interna{
    max-width:1560px;margin:0 auto;padding:12px 24px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .marca{display:flex;align-items:center;gap:10px;margin-right:4px}
  .marca-vi{
    font-size:26px;line-height:1;
    background:linear-gradient(180deg,var(--ciano),var(--rosa));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .marca-txt{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--apagado)}

  .pills{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .pill{
    font:inherit;font-size:12.5px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--linha);background:transparent;color:var(--apagado);
    cursor:pointer;transition:.18s;display:flex;align-items:center;gap:7px;
  }
  .pill b{font-size:11px;color:var(--rosa);font-variant-numeric:tabular-nums}
  .pill:hover{border-color:var(--rosa);color:var(--tinta)}
  .pill.ativo{background:var(--rosa);border-color:var(--rosa);color:#fff}
  .pill.ativo b{color:rgba(255,255,255,.75)}

  .chave{font-size:12px;color:var(--apagado);display:flex;align-items:center;gap:8px}
  .tecla{
    display:inline-block;min-width:20px;text-align:center;padding:2px 6px;
    border:1px solid var(--linha);border-radius:5px;background:var(--painel);
    color:var(--tinta);font-size:11px;
  }
  .btn-com{
    font:inherit;font-size:12.5px;padding:7px 12px;border-radius:8px;
    border:1px solid var(--linha);background:var(--painel);color:var(--apagado);cursor:pointer;transition:.18s;
  }
  .btn-com:hover{border-color:var(--ciano);color:var(--tinta)}
  .btn-com.ativo{border-color:var(--ciano);color:var(--ciano)}

  /* ---------- seções ---------- */
  .secao{
    max-width:1560px;margin:0 auto;padding:56px 24px;
    border-top:1px solid var(--linha);scroll-margin-top:70px;
  }
  .secao:first-of-type{border-top:none;padding-top:44px}
  .cabeca{display:flex;align-items:flex-start;gap:18px;margin-bottom:26px}
  .num{
    font-family:"Anton","Impact",sans-serif;font-size:52px;line-height:.8;color:transparent;
    -webkit-text-stroke:1.5px var(--roxo);font-variant-numeric:tabular-nums;flex:none;
  }
  .cabeca h2{font-size:clamp(24px,3.2vw,38px);line-height:1;margin:0 0 8px;color:var(--creme)}
  .cabeca .resumo{margin:0;color:var(--apagado);font-size:15.5px;line-height:1.6;max-width:70ch}

  .dupla{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}

  /* ---------- painel de código ---------- */
  .painel{background:var(--painel);border:1px solid var(--linha);border-radius:14px;overflow:hidden}
  .painel + .painel{margin-top:12px}
  .painel-topo{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;border-bottom:1px solid var(--linha);background:var(--painel-2);
  }
  .painel-titulo{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--apagado);
    display:flex;align-items:center;gap:8px;
  }
  .ponto{width:8px;height:8px;border-radius:50%;background:var(--rosa)}
  .ponto.ciano{background:var(--ciano)}
  .arquivo{font-size:11px;color:var(--apagado);font-family:ui-monospace,Menlo,Consolas,monospace}

  pre.codigo{
    margin:0;padding:18px 16px;overflow-x:auto;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:13.5px;line-height:1.75;tab-size:2;color:#e6dcf7;
  }
  pre.codigo .tag{color:var(--rosa)}
  pre.codigo .nome{color:#ff8ab8}
  pre.codigo .atr{color:var(--ciano)}
  pre.codigo .val{color:var(--creme)}
  pre.codigo .com{color:#6f6291;font-style:italic}

  /* ---------- painel da direita ---------- */
  .quadro{
    background:var(--painel);border:1px solid var(--linha);border-radius:14px;overflow:hidden;
    position:sticky;top:78px;
  }
  .quadro-img{
    padding:14px;background:
      linear-gradient(180deg,rgba(255,61,139,.10),transparent 45%),
      repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 8px,transparent 8px 16px);
  }
  .legenda{padding:12px 16px 16px;border-top:1px solid var(--linha);font-size:13.5px;color:var(--apagado);line-height:1.6}
  .legenda b{color:var(--tinta);font-weight:600}
  .legenda code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
    background:rgba(53,214,231,.10);color:#9fe9f2;padding:1px 5px;border-radius:5px}

  /* ---------- notas ---------- */
  .notas{margin-top:20px;display:grid;gap:10px}
  .nota{
    display:flex;gap:12px;align-items:flex-start;
    background:rgba(255,255,255,.025);border:1px solid var(--linha);border-left:3px solid var(--roxo);
    border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.6;color:#d9cfee;
  }
  .nota code{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;
    background:rgba(255,61,139,.13);color:#ff9cc4;padding:1px 6px;border-radius:5px;
  }
  .nota .chip{
    flex:none;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ciano);
    border:1px solid rgba(53,214,231,.35);border-radius:999px;padding:3px 9px;margin-top:2px;
  }
  .nota.alerta{border-left-color:var(--rosa);background:rgba(255,61,139,.05)}
  .nota.alerta .chip{color:var(--rosa);border-color:rgba(255,61,139,.4)}

  .tags-usadas{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
  .tag-chip{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    border:1px solid var(--linha);border-radius:6px;padding:4px 8px;color:var(--apagado);
  }
  .tag-chip b{color:var(--creme);font-weight:400}

  /* ---------- moldura das demos ---------- */
  .demo{
    border-radius:8px;overflow:hidden;background:#000;
    border:1px solid rgba(255,255,255,.07);box-shadow:0 18px 50px rgba(0,0,0,.6);
  }
  .demo-corpo{padding:14px;background:#080510}
  .demo code{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    background:rgba(53,214,231,.10);color:#9fe9f2;padding:1px 5px;border-radius:5px;
  }
  .d-linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .d-btn{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:6px 11px;border-radius:7px;
    border:1px solid var(--linha);background:var(--painel);color:var(--apagado);cursor:pointer;transition:.18s;
  }
  .d-btn:hover{border-color:var(--ciano);color:var(--tinta)}
  .d-btn.on{border-color:var(--rosa);color:#fff;background:rgba(255,61,139,.18)}
  .d-dica{font-size:11.5px;color:#6f6291}

  /* ---------- réplica do projeto real ---------- */
  .p-tela{
    position:relative;height:330px;overflow:hidden;background:#000;
    font-family:"Inter",system-ui,sans-serif;
  }
  .p-menu{
    position:absolute;top:0;left:0;right:0;height:34px;z-index:10;
    display:flex;align-items:center;padding:0 14px;
    transition:transform .3s ease;
  }
  .p-menu span{
    font-family:"Anton","Impact",sans-serif;font-size:17px;color:#fff;
    letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.7);
  }
  .p-menu.menu-rolado{transform:translateY(-100%)}

  .p-scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:thin}

  .p-capa{
    position:relative;height:330px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 20%, #3b1a4a, #12060f 70%);
  }
  .p-video{
    position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
    background:#000;border:1px solid rgba(255,255,255,.10);
  }
  .p-video span{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    letter-spacing:.34em;text-transform:uppercase;color:var(--creme);
  }
  .p-capa-conteudo{
    position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:0 14px;text-align:center;
  }
  .p-arte{width:min(210px,72%);height:auto;display:block;filter:drop-shadow(0 12px 30px rgba(0,0,0,.7))}
  .p-arte-fallback{
    font-family:"Anton","Impact",sans-serif;font-size:44px;line-height:1;color:#fff;
    text-shadow:0 6px 24px rgba(0,0,0,.8);
  }
  .p-barra{
    position:absolute;left:0;right:0;bottom:34px;z-index:3;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:0 16px;font-size:9.5px;
  }
  .p-barra div{display:flex;flex-direction:column;gap:2px;min-width:78px}
  .p-barra b{
    font-weight:400;font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);
  }
  .p-barra i{font-style:normal;color:#fff;font-size:10px}
  .p-botao{
    background:#ff3d8b;color:#fff;border-radius:999px;padding:6px 14px;
    font-size:10px;font-weight:600;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  }
  .p-botao img{width:9px;height:9px;display:block}
  .p-seta{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    width:14px;height:14px;z-index:3;opacity:.8;
  }

  .p-secao{padding:34px 16px;background:#070409}
  .p-central{max-width:none}
  .p-rotulo{
    margin:0 0 4px;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#ff3d8b;
  }
  .p-central h4{
    margin:0 0 8px;font-family:"Anton","Impact",sans-serif;font-size:22px;line-height:1;
    color:#f7e8c9;letter-spacing:.02em;text-transform:uppercase;font-weight:400;
  }
  .p-central p.txt{margin:0;font-size:10.5px;line-height:1.7;color:#9c8dbb}
  .p-card{
    border-radius:10px;padding:16px;
    background:linear-gradient(140deg,rgba(255,61,139,.22),rgba(162,89,255,.14)),#100a1c;
    border:1px solid rgba(255,255,255,.08);
  }
  .p-card .p-botao{margin-top:10px}
  .p-rodape{
    padding:18px 16px 26px;background:#050308;color:#5b4d78;font-size:9px;line-height:1.8;
    border-top:1px solid rgba(255,255,255,.06);
  }
  .p-rodape b{
    display:block;font-family:"Anton","Impact",sans-serif;font-size:14px;color:#8b7db0;
    letter-spacing:.04em;margin-bottom:6px;font-weight:400;
  }

  /* estados que o JavaScript liga/desliga */
  .modo-blocos .p-central{
    opacity:0;transform:translateY(30px);
    transition:opacity 1s ease-out, transform 1s ease-out;
  }
  .modo-blocos .p-central.visivel{opacity:1;transform:translateY(0)}

  .p-hud{
    position:absolute;right:8px;bottom:8px;z-index:20;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:var(--apagado);
    background:rgba(11,7,19,.88);border:1px solid var(--linha);border-radius:6px;padding:4px 8px;
  }
  .p-hud b{color:var(--ciano);font-weight:400}
  .p-hud b.rosa{color:var(--rosa)}

  .d-slider{width:100%;margin:14px 0 8px;accent-color:var(--rosa)}
  .d-numeros{display:flex;gap:14px;flex-wrap:wrap;font-family:ui-monospace,monospace;font-size:11px;color:#6f6291}
  .d-numeros b{color:var(--ciano);font-weight:400}
  .d-numeros b.erro{color:var(--rosa)}

  /* f5 */
  .d-f5-tela{
    height:150px;border:1px solid var(--linha);border-radius:8px;
    background:linear-gradient(165deg,#1d1136,#0b0713 70%);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;
    font-size:12.5px;line-height:1.6;color:var(--apagado);
  }
  .d-f5-tela .titulo{
    display:block;font-family:"Anton","Impact",sans-serif;font-size:20px;
    letter-spacing:.02em;text-transform:uppercase;margin-bottom:6px;
  }
  .d-f5-tela.ruim{border-color:rgba(255,61,139,.5)}
  .d-f5-tela.ruim .titulo{color:var(--rosa)}
  .d-f5-tela.bom{border-color:rgba(53,214,231,.5)}
  .d-f5-tela.bom .titulo{color:var(--ciano)}

  /* mapa dos arquivos */
  .d-arq{display:grid;gap:10px}
  .d-arq-item{border:1px solid var(--linha);border-radius:10px;padding:11px 13px;background:rgba(255,255,255,.02)}
  .d-arq-item h4{
    margin:0 0 7px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--ciano);
    font-weight:400;display:flex;align-items:center;gap:8px;
  }
  .d-arq-item h4 em{
    font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--apagado);
    border:1px solid var(--linha);border-radius:999px;padding:2px 8px;
  }
  .d-arq-item ul{margin:0;padding-left:17px;color:var(--apagado);font-size:12.5px;line-height:1.7}
  .d-arq-item ul b{color:var(--creme);font-weight:600}

  /* ---------- fim ---------- */
  .fim{
    max-width:1560px;margin:0 auto;padding:60px 24px 100px;
    border-top:1px solid var(--linha);color:var(--apagado);font-size:14px;
  }
  .fim h2{color:var(--creme);font-size:28px;margin:0 0 12px}
  .fim p{max-width:70ch;line-height:1.7}
  .fim code{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;
    background:rgba(255,61,139,.13);color:#ff9cc4;padding:1px 6px;border-radius:5px;
  }

  @media (max-width:1000px){
    .dupla{grid-template-columns:1fr}
    .quadro{position:static;order:-1}
    .num{font-size:38px}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{transition:none!important}
  }
</style>
</head>
<body>

<div class="barra">
  <div class="barra-interna">
    <div class="marca">
      <span class="display marca-vi">VI</span>
      <span class="marca-txt">Código&nbsp;→&nbsp;Comportamento</span>
    </div>
    <nav class="pills" id="pills"></nav>
    <button class="btn-com ativo" id="toggleCom">Comentários: ligados</button>
    <span class="chave"><span class="tecla">←</span><span class="tecla">→</span> navega</span>
  </div>
</div>

<main id="secoes"></main>

<section class="fim">
  <h2 class="display">É só isso</h2>
  <p>Repara que nenhuma linha de hoje desenhou coisa alguma na tela. O JavaScript achou elementos, escutou eventos e trocou nomes de classe — o resto já estava no CSS, esperando esse nome chegar. É sempre a mesma receita: <code>achar</code> → <code>escutar</code> → <code>trocar</code>.</p>
</section>

<script>
/* ---------------------------------------------------------------
   Conteúdo da aula. Cada item = uma parte da Live 3, com o código
   que a pessoa digita e a página real rodando ao lado.
---------------------------------------------------------------- */
const BASE = "https://dev-em-dobro.github.io/szpc-gta-6/assets/";
const ARTE  = BASE + "gta-box-art.jpeg";
const SETA  = BASE + "seta-baixo.png";
const PLAY  = BASE + "icone-play.png";
const DURACAO = 5.04; // segundos do vídeo da capa

const CONTEUDO = [
  {
    id:"menu",
    curto:"Menu",
    titulo:"O menu que some ao rolar",
    resumo:"A barra do topo é transparente por cima do vídeo da capa. Assim que a pessoa rola, ela desliza pra cima e sai da tela; quando volta pro topo, ela volta deslizando.",
    blocos:[
      {arq:"script.js — parte 1", lang:"js", txt:
`const menu = document.getElementById("menu");

window.addEventListener("scroll", function () {
  // depois dos primeiros 50px, o menu sai da tela.
  // volta sozinho quando a pessoa chega no topo de novo.
  if (window.scrollY > 50) {
    menu.classList.add("menu-rolado");
  } else {
    menu.classList.remove("menu-rolado");
  }
});`},
      {arq:"style.css — o menu ganha 2 coisas", lang:"css", txt:
`.menu {
  /* ...tudo o que já estava aqui da Live 2... */
  transition: transform 0.3s ease;
}

.menu-rolado {
  transform: translateY(-100%);
}`}
    ],
    chips:["document","getElementById","addEventListener","\"scroll\"","window.scrollY","if / else","classList","transition"],
    notas:[
      {chip:"ACHAR", txt:"<code>document</code> é a página inteira, vista por dentro pelo JavaScript. <code>getElementById(\"menu\")</code> procura <b>um</b> elemento pelo <code>id</code> que ele tem lá no HTML — aquele <code>&lt;nav class=\"menu\" id=\"menu\"&gt;</code> da Live 1. O <code>const</code> guarda o achado numa caixinha pra não precisar procurar de novo."},
      {chip:"ESCUTAR", txt:"<code>addEventListener</code> é “fica de olho e me avisa”. O primeiro pedaço é <b>o quê</b> (<code>\"scroll\"</code>), o segundo é <b>o que fazer</b> quando acontecer. Essa função entre parênteses roda dezenas de vezes por segundo enquanto a pessoa rola."},
      {chip:"scrollY", txt:"<code>window</code> é a janela do navegador. <code>window.scrollY</code> é quanto a pessoa já rolou, em pixels — no topo vale <code>0</code>. Põe um <code>console.log(window.scrollY)</code> lá dentro, abre o Console (F12) e rola: dá pra ver o número correndo."},
      {chip:"if / else", txt:"<code>if</code> é “se”. <code>else</code> é “senão”. Os dois são obrigatórios aqui: só com o <code>if</code>, o menu sai da tela e <b>nunca mais volta</b>, porque ninguém manda remover a classe."},
      {chip:"transition", txt:"<code>translateY(-100%)</code> significa “sobe a sua própria altura”, ou seja, some pra cima. Quem faz isso ser suave é o <code>transition: transform 0.3s ease</code> no <code>.menu</code> — sem ele o menu some de um frame pro outro."},
      {chip:"Atenção", txt:"Nada disso funciona se o <code>&lt;script&gt;</code> não estiver no <b>fim</b> do <code>&lt;body&gt;</code>. O navegador lê a página de cima pra baixo: se o script rodar antes, o <code>&lt;nav id=\"menu\"&gt;</code> ainda não existe e o <code>getElementById</code> devolve <code>null</code>."}
    ],
    demo:"menu",
    legenda:"<b>É a página de verdade aqui do lado — rola dentro dela.</b> O contador mostra o <code>scrollY</code> e o momento exato em que ele passa de 50: é ali que a classe <code>menu-rolado</code> entra e sai."
  },

  {
    id:"blocos",
    curto:"Blocos",
    titulo:"Os blocos que aparecem subindo",
    resumo:"Os textos das seções começam invisíveis e um pouquinho pra baixo. Quando entram na tela, sobem com fade. Quem avisa que eles entraram é o IntersectionObserver.",
    blocos:[
      {arq:"index.html — a classe entra em 2 lugares", lang:"html", txt:
`<!-- sempre na <div> de dentro, nunca na <section> e nunca no rodapé -->
<section class="secao-historia">
  <div class="conteudo-central aparecer"> ... </div>
</section>

<section class="secao-video">
  <div class="conteudo-central aparecer"> ... </div>
</section>`},
      {arq:"script.js — parte 2", lang:"js", txt:
`const blocos = document.querySelectorAll(".aparecer");

const observador = new IntersectionObserver(function (entradas) {
  entradas.forEach(function (entrada) {
    if (entrada.isIntersecting) {
      entrada.target.classList.add("visivel");
      observador.unobserve(entrada.target);
    }
  });
}, { threshold: 0.15 });

// manda o observador vigiar cada um dos blocos da lista

/* ---------------- coloração do código ---------------- */
function escapar(t){
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function pintarTag(tag){
  return tag.replace(/^(&lt;\/?)([a-zA-Z0-9!-]*)([\s\S]*?)(\/?&gt;)$/, function(_,ab,nome,resto,fe){
    const attrs = resto.replace(/([a-zA-Z-]+)(=)("[^"]*")/g,
        '<span class="atr">$1</span>=<span class="val">$3</span>')
      .replace(/(\s)([a-zA-Z-]+)(?=[\s]|$)/g, '$1<span class="atr">$2</span>');
    return '<span class="tag">'+ab+'</span><span class="nome">'+nome+'</span>'+attrs+'<span class="tag">'+fe+'</span>';
  });
}

function pintarHTML(codigo){
  let t = escapar(codigo);
  const guarda = [];
  t = t.replace(/&lt;!--[\s\S]*?--&gt;/g, m => {
    guarda.push('<span class="com">'+m+'</span>');
    return "\u0000"+(guarda.length-1)+"\u0000";
  });
  t = t.replace(/&lt;\/?[a-zA-Z!][\s\S]*?&gt;/g, m => {
    guarda.push(pintarTag(m));
    return "\u0000"+(guarda.length-1)+"\u0000";
  });
  return t.replace(/\u0000(\d+)\u0000/g, (_,i) => guarda[+i]);
}

function pintarJS(codigo){
  let t = escapar(codigo);
  const guarda = [];
  const guardar = h => { guarda.push(h); return "\u0000"+(guarda.length-1)+"\u0001"; };

  t = t.replace(/\/\*[\s\S]*?\*\/|\/\/[^\n]*/g, m => guardar('<span class="com">'+m+'</span>'));
  t = t.replace(/(["'])(?:\\.|(?!\1)[^\\\n])*\1/g, m => guardar('<span class="val">'+m+'</span>'));

  return t.split(/(\u0000\d+\u0001)/).map(parte=>{
    if(/^\u0000\d+\u0001$/.test(parte)) return guarda[+parte.slice(1,-1)];
    return parte
      .replace(/\b(const|let|var|function|return|if|else|new|true|false|null|undefined|this)\b/g,
          '<span class="tag">$1</span>')
      .replace(/\b(\d+\.?\d*)\b/g, '<span class="nome">$1</span>')
      .replace(/([A-Za-z_$][\w$]*)(?=\s*\()/g, '<span class="atr">$1</span>');
  }).join("");
}

function pintarCSS(codigo){
  let t = escapar(codigo);
  const guarda = [];
  const guardar = h => { guarda.push(h); return "\u0000"+(guarda.length-1)+"\u0000"; };
  t = t.replace(/\/\*[\s\S]*?\*\//g, m => guardar('<span class="com">'+m+'</span>'));
  t = t.replace(/([^{};\u0000\n][^{};\u0000]*)(\{)/g, (m,sel,ab)=>'<span class="nome">'+sel+'</span>'+ab);
  t = t.replace(/([-a-zA-Z]+)(\s*:\s*)([^;{}\n]+)(;)/g,
      '<span class="atr">$1</span>$2<span class="val">$3</span>$4');
  return t.replace(/\u0000(\d+)\u0000/g, (_,i) => guarda[+i]);
}

function pintar(codigo, lang){
  if(lang === "html") return pintarHTML(codigo);
  if(lang === "css")  return pintarCSS(codigo);
  return pintarJS(codigo);
}

function tirarComentarios(codigo, lang){
  let t = codigo;
  if(lang === "html"){
    t = t.replace(/[ \t]*<!--[\s\S]*?-->[ \t]*\n?/g, "");
  } else {
    t = t.replace(/[ \t]*\/\*[\s\S]*?\*\/[ \t]*\n?/g, "");
    t = t.replace(/[ \t]*\/\/[^\n]*\n?/g, "");
  }
  return t.replace(/\n{3,}/g, "\n\n").trim();
}

        <div class="quadro-img" data-demo="${s.demo}">${demoHTML(s.demo)}</div>
        <p class="legenda">${s.legenda}</p>
      </div>
    </div>`;
  alvo.appendChild(sec);

  const p = document.createElement("button");
  p.className = "pill";
  p.innerHTML = `<b>${n}</b> ${s.curto}`;
  p.addEventListener("click", ()=> document.getElementById(s.id).scrollIntoView({block:"start"}));
  pills.appendChild(p);
});

function renderizarCodigos(){
  document.querySelectorAll("pre.codigo").forEach(pre=>{
    const cru = decodeURIComponent(pre.dataset.cru);
    const lang = pre.dataset.lang;
    pre.innerHTML = pintar(comentariosLigados ? cru : tirarComentarios(cru, lang), lang);
  });
}
renderizarCodigos();

document.getElementById("toggleCom").addEventListener("click", e=>{
  comentariosLigados = !comentariosLigados;
  e.target.textContent = "Comentários: " + (comentariosLigados ? "ligados" : "desligados");
  e.target.classList.toggle("ativo", comentariosLigados);
  renderizarCodigos();
});

/* ---------------- ligar as demos ---------------- */
function iniciarDemos(){

  /* 01 — o menu que some ao rolar */
  document.querySelectorAll('[data-demo="menu"]').forEach(raiz=>{
    const area  = raiz.querySelector(".p-scroll");
    const menu  = raiz.querySelector(".p-menu");
    const valor = raiz.querySelector(".p-hud .v");
    const estado= raiz.querySelector(".p-hud .c");

    area.addEventListener("scroll", function(){
      const y = Math.round(area.scrollTop);
      valor.textContent = y;
      if(y > 50){
        menu.classList.add("menu-rolado");
        estado.textContent = "menu-rolado";
        estado.classList.add("rosa");
      } else {
        menu.classList.remove("menu-rolado");
        estado.textContent = "sem classe";
        estado.classList.remove("rosa");
      }
    });
  });

  /* 02 — os blocos que aparecem */
  document.querySelectorAll('[data-demo="blocos"]').forEach(raiz=>{
    const area = raiz.querySelector(".p-scroll");
    const contador = raiz.querySelector(".p-hud .v");
    let observador = null;

    function ligar(){
      if(observador) observador.disconnect();
      let vistos = 0;
      contador.textContent = "0";
      raiz.querySelectorAll(".p-central").forEach(b=>b.classList.remove("visivel"));
      area.scrollTop = 0;

      observador = new IntersectionObserver(function(entradas){
        entradas.forEach(function(entrada){
          if(entrada.isIntersecting){
            entrada.target.classList.add("visivel");
            observador.unobserve(entrada.target);
            vistos++;
            contador.textContent = vistos;
          }
        });
      }, { root: area, threshold: 0.15 });

      raiz.querySelectorAll(".p-central").forEach(b=>observador.observe(b));
    }
    raiz.querySelector('[data-acao="reiniciar"]').addEventListener("click", ligar);
    ligar();
  });

  /* 03 — o vídeo com scrub */
  document.querySelectorAll('[data-demo="scrub"]').forEach(raiz=>{
    const slider   = raiz.querySelector(".d-slider");
    const conteudo = raiz.querySelector(".p-capa-conteudo");
    const barra    = raiz.querySelector(".p-barra");
    const seta     = raiz.querySelector(".p-seta");
    const video    = raiz.querySelector(".p-video");
    const pct = raiz.querySelector(".p");
    const ov  = raiz.querySelector(".ov");
    const ct  = raiz.querySelector(".ct");

    function atualizar(){
      const p = slider.value / 100;

      // o conteúdo da capa some nos primeiros 10% (duration: 0.1)
      const fora = Math.min(p / 0.10, 1);
      [conteudo, barra, seta].forEach(el=>{
        if(!el) return;
        el.style.opacity = (1 - fora).toFixed(2);
        el.style.transform = (el === seta ? "translateX(-50%) " : "") +
          "scale(" + (1 - 0.4*fora).toFixed(3) + ")";
      });

      // o vídeo aparece ao longo dos primeiros 80% (duration: 0.8)
      const op = Math.min(p / 0.80, 1);
      video.style.opacity = op.toFixed(2);

      // currentTime anda do começo ao fim, na mesma velocidade do scroll
      pct.textContent = Math.round(slider.value);
      ov.textContent = op.toFixed(2);
      ct.textContent = (p * DURACAO).toFixed(2);
    }

    slider.addEventListener("input", atualizar);
    atualizar();
  });

  /* 04 — o F5 no meio da cena */
  document.querySelectorAll('[data-demo="f5"]').forEach(raiz=>{
    const tela = raiz.querySelector(".d-f5");
    const telas = {
      com:'<div class="d-f5-tela bom"><div><span class="titulo">Capa inteira, do topo</span>' +
          'A página recomeçou em <code>scrollY = 0</code>. O <code>pin</code> calcula as posições certas e a cena roda inteira.</div></div>',
      sem:'<div class="d-f5-tela ruim"><div><span class="titulo">Cena quebrada</span>' +
          'A página voltou em <code>scrollY = 1840</code>, no meio do pin. A capa aparece sobreposta ao texto e o vídeo trava num frame do meio.</div></div>'
    };
    function mostrar(qual){
      tela.innerHTML = telas[qual];
      raiz.querySelectorAll("[data-f5]").forEach(b=>b.classList.toggle("on", b.dataset.f5===qual));
    }
    raiz.querySelectorAll("[data-f5]").forEach(b=>b.addEventListener("click", ()=>mostrar(b.dataset.f5)));
    mostrar("com");
  });
}
iniciarDemos();

/* pill ativa conforme rola */
const secoes = [...document.querySelectorAll(".secao")];
const botoes = [...pills.children];
const obs = new IntersectionObserver(entradas=>{
  entradas.forEach(en=>{
    if(en.isIntersecting){
      const i = secoes.indexOf(en.target);
      botoes.forEach((b,j)=>b.classList.toggle("ativo", j===i));
    }
  });
},{rootMargin:"-20% 0px -70% 0px"});
secoes.forEach(s=>obs.observe(s));

/* setas do teclado navegam entre as partes */
document.addEventListener("keydown", e=>{
  if(e.target.tagName === "INPUT") return;
  if(e.target.tagName === "BUTTON" && (e.key==="ArrowLeft"||e.key==="ArrowRight")) e.target.blur();
  if(e.key!=="ArrowRight" && e.key!=="ArrowLeft") return;
  const atual = botoes.findIndex(b=>b.classList.contains("ativo"));
  let prox = atual + (e.key==="ArrowRight" ? 1 : -1);
  if(atual === -1) prox = 0;
  prox = Math.max(0, Math.min(secoes.length-1, prox));
  secoes[prox].scrollIntoView({block:"start"});
});
</script>
