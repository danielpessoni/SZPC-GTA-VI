<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="./src/assets/geral/favicon-yellow.png" type="image/x-icon">

    <link rel="stylesheet" href="./src/css/geral/variaveis.css">

    <title>GTA VI — SZPC</title>

<body>

        <header class="cabecalho">

        <main class="conteudo">

            <section class="apresentacao">

                    <div class="imagem-container">
                        <img class="avatar" src="#" alt="Foto de perfil do GitHub">

                    <div class="texto">
                        <h2 class="nome"></h2>
                    </div>

                    <nav class="navegacao-autor" aria-label="Links do autor">
                        <a class="botao" href="https://github.com/danielpessoni">
                            Meu GitHub
                        </a>

                        <a class="botao" href="#">
                            Meu Portfólio
                        </a>
                    </nav>

                </article>


                <!-- PROJETO -->
                <article class="coluna coluna-projeto">
                    <div class="imagem-container">
                        <img class="imagem-projeto" src="./src/assets/assets-tutorial/capa.jpg" alt="Imagem representativa do projeto">

                        <h1 class="titulo">Projeto GTA VI</h1>

                    <nav class="navegacao-projeto" aria-label="Materiais do projeto">

                        <a class="botao" href="https://danielpessoni.github.io/SZPC-GTA-VI/html/tutorial1.html">
                            Tutorial — Aula 1

                        <a class="botao" href="#">
                            Tutorial — Aula 2
                        </a>

                        <a class="botao" href="#">
                            Tutorial — Aula 3
                        </a>

                        <a class="botao" href="https://github.com/danielpessoni/SZPC-GTA-VI">
                            Meu Repositório
                        </a>
                    </nav>
                </article>


                <!-- MENTORES -->
                <article class="coluna coluna-mentores">

                    <div class="imagem-container">
                        <img class="avatar" src="#" alt="Foto de perfil do GitHub dos mentores">
                    </div>

                    <div class="texto">
                        <h2 class="titulo nome"></h2>
                    </div>

                    <nav class="navegacao-mentores" aria-label="Links dos mentores">
                        <a class="botao" href="#">
                            Repositório dos mentores
                        </a>

                        <a class="botao" href="https://www.youtube.com/@DevemDobro">

                        </a>

                        <a class="botao" href="https://www.instagram.com/devemdobro/">
                            Instagram dos mentores
                        </a>
                    </nav>
